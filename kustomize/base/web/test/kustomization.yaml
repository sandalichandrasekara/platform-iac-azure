apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Environment overlay for 'test'. Only 'dev' is wired to a cluster today; the
# other environments mirror the reference multi-environment layout.
resources:
  - ../

commonLabels:
  environment: test

# CI pins the image here, e.g.:
#   kustomize edit set image web=<acr-login-server>/web:<tag>
images:
  - name: web
    newName: web
    newTag: test-latest
