apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: app

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - hpa.yaml

# CI runs `kustomize edit set image` here to pin the built tag.
images:
  - name: acr_login_server/web
    newTag: latest
